# .github/workflows/wiki-sync.yml
# 隧道工程多维协同智能排水自适应平台 - GitHub Wiki 持续同步发布流水线 (wiki-curator 标准规范)
name: "GitHub Wiki Sync Pipeline"

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'doc/wiki_staging/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

concurrency:
  group: wiki-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-wiki:
    name: "Deploy Staging to GitHub Wiki"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Main Repository"
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: "Checkout Wiki Repository"
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          token: ${{ secrets.WIKI_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
          path: wiki-repo

      - name: "Sync Staged Documents to Wiki"
        run: |
          echo "=== 正在同步 doc/wiki_staging 至 Wiki 工作区 ==="
          # 清理除 .git 之外的历史残留页面，实现精确镜像同步
          find wiki-repo -mindepth 1 -maxdepth 1 -not -name '.git' -exec rm -rf {} +
          cp -r main-repo/doc/wiki_staging/. wiki-repo/
          ls -la wiki-repo/

      - name: "Commit and Deploy Changes to Wiki"
        working-directory: wiki-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain)" ]; then
            echo ">>> Wiki 没有任何变动，无需提交。"
            exit 0
          fi

          echo ">>> 检测到 Wiki 内容变更，准备提交并推送..."
          git add .
          git commit -m "docs(wiki): automated sync from main commit ${{ github.sha }}"
          git push origin HEAD
          echo "=== GitHub Wiki 知识库已成功发布并上线! ==="
