# tunnel-drainage-platform/deploy/server/nginx/nginx.conf
# 动静分离、大包缓冲与长时导出反向代理配置

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # 启用 Gzip 压缩，优化 3D 静态网格、字体与大型 JS 资源传输
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    upstream backend_cluster {
        server backend:8000;
        keepalive 32;
    }

    server {
        listen       80;
        server_name  _;

        # 静态前端 SPA 路由与缓存控制
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;

            # index.html 严禁强缓存，确保版本发布即时生效
            location = /index.html {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
            }

            # 静态哈希资源长期缓存
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, max-age=31536000, immutable";
            }
        }

        # 后端 API 反向代理与长时计算防断开配置
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 批量工程计算书及长里程大表单导出的防超时设置
            proxy_read_timeout 300s;
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            client_max_body_size 50M;
        }

        # 健康检查代理透传
        location /health {
            proxy_pass http://backend_cluster/health;
            proxy_set_header Host $host;
        }
    }
}
